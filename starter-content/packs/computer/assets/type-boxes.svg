<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="四种基本类型的盒子与字节数">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f5f1; stroke: #e5e2d9; }
    .cell { fill: #e8f1ee; stroke: #cfe3dc; }
    .ink { fill: #1b1b18; }
    .muted { fill: #6d6a60; }
    .accent { fill: #1d6b5c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .ui { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 17px; font-weight: 700; }
    .type { font-size: 18px; font-weight: 700; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .box { fill: #232720; stroke: #3b413b; }
      .cell { fill: #1c322c; stroke: #2f5147; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .accent { fill: #7cc9b4; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="860" height="320" rx="16"/>
  <text class="ui title ink" x="36" y="44">四个盒子，四种大小</text>
  <text class="ui small muted" x="36" y="66">sizeof 的结果；考试默认按 4 / 4 / 8 / 1 字节记</text>

  <!-- int -->
  <rect class="box" x="36" y="94" width="182" height="180" rx="12"/>
  <text class="mono type accent" x="56" y="128">int</text>
  <text class="ui small muted" x="56" y="150">整数，格式符 %d</text>
  <g>
    <rect class="cell" x="56" y="170" width="34" height="38" rx="5"/>
    <rect class="cell" x="96" y="170" width="34" height="38" rx="5"/>
    <rect class="cell" x="136" y="170" width="34" height="38" rx="5"/>
    <rect class="cell" x="176" y="170" width="26" height="38" rx="5"/>
  </g>
  <text class="ui small ink" x="56" y="238">4 字节 = 4 个格子</text>

  <!-- float -->
  <rect class="box" x="238" y="94" width="182" height="180" rx="12"/>
  <text class="mono type accent" x="258" y="128">float</text>
  <text class="ui small muted" x="258" y="150">小数，格式符 %f</text>
  <g>
    <rect class="cell" x="258" y="170" width="34" height="38" rx="5"/>
    <rect class="cell" x="298" y="170" width="34" height="38" rx="5"/>
    <rect class="cell" x="338" y="170" width="34" height="38" rx="5"/>
    <rect class="cell" x="378" y="170" width="26" height="38" rx="5"/>
  </g>
  <text class="ui small ink" x="258" y="238">4 字节，精度较低</text>

  <!-- double -->
  <rect class="box" x="440" y="94" width="182" height="180" rx="12"/>
  <text class="mono type accent" x="460" y="128">double</text>
  <text class="ui small muted" x="460" y="150">小数，格式符 %lf</text>
  <g>
    <rect class="cell" x="460" y="170" width="14" height="38" rx="3"/>
    <rect class="cell" x="478" y="170" width="14" height="38" rx="3"/>
    <rect class="cell" x="496" y="170" width="14" height="38" rx="3"/>
    <rect class="cell" x="514" y="170" width="14" height="38" rx="3"/>
    <rect class="cell" x="532" y="170" width="14" height="38" rx="3"/>
    <rect class="cell" x="550" y="170" width="14" height="38" rx="3"/>
    <rect class="cell" x="568" y="170" width="14" height="38" rx="3"/>
    <rect class="cell" x="586" y="170" width="14" height="38" rx="3"/>
  </g>
  <text class="ui small ink" x="460" y="238">8 字节，精度较高</text>

  <!-- char -->
  <rect class="box" x="642" y="94" width="182" height="180" rx="12"/>
  <text class="mono type accent" x="662" y="128">char</text>
  <text class="ui small muted" x="662" y="150">单个字符，格式符 %c</text>
  <g>
    <rect class="cell" x="662" y="170" width="34" height="38" rx="5"/>
  </g>
  <text class="ui small ink" x="662" y="238">1 字节，存的是编码</text>
  <text class="ui small muted" x="662" y="258">'A' = 65</text>
</svg>