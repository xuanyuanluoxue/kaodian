<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="动图：x 从左右两侧趋近 0，|x|/x 的左极限是 -1、右极限是 1">
  <style>
    .bg { fill: #ffffff; }
    .axis { stroke: #6d6a60; stroke-width: 1.4; fill: none; }
    .tick { fill: #6d6a60; font-size: 12px; font-family: -apple-system, "PingFang SC", sans-serif; }
    .ink { fill: #1b1b18; font-family: -apple-system, "PingFang SC", sans-serif; }
    .muted { fill: #6d6a60; font-family: -apple-system, "PingFang SC", sans-serif; }
    .left { stroke: #a85a1f; stroke-width: 3; }
    .right { stroke: #1d6b5c; stroke-width: 3; }
    .dotL { fill: #a85a1f; }
    .dotR { fill: #1d6b5c; }
    .hollow { fill: #ffffff; stroke-width: 2; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .axis { stroke: #a3a095; }
      .tick { fill: #a3a095; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .curve { stroke: #7cc9b4; }
      .sec { stroke: #e0a56f; }
      .tan { stroke: #8fb6dd; }
      .dot { fill: #e0a56f; }
      .hollow { fill: #1a1d1a; stroke: #7cc9b4; }
      .box { fill: #232720; stroke: #3b413b; }
      .box-ink { fill: #eae8e1; }
      .accent { fill: #7cc9b4; }
    }

  </style>
  <rect class="bg" x="0" y="0" width="760" height="340" rx="16"/>
  <text class="ink" x="36" y="42" font-size="18" font-weight="700">左右夹击：|x| / x 在 0 处</text>
  <text class="muted" x="36" y="64" font-size="13">左边恒为 -1，右边恒为 1；左右都存在，但不相等</text>

  <line class="axis" x1="120" y1="170" x2="650" y2="170" marker-end="url(#arr2)"/>
  <line class="axis" x1="380" y1="300" x2="380" y2="60" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6d6a60"/></marker></defs>
  <g class="tick">
    <text x="190" y="192">-2</text><text x="282" y="192">-1</text>
    <text x="466" y="192">1</text><text x="556" y="192">2</text>
  </g>

  <line class="left" x1="146.0" y1="240" x2="374.6" y2="240"/>
  <circle class="hollow" cx="380" cy="240" r="6" stroke="#a85a1f"/>
  <text class="muted" x="155.0" y="228" font-size="13">y = -1</text>

  <line class="right" x1="385.4" y1="100" x2="614.0" y2="100"/>
  <circle class="hollow" cx="380" cy="100" r="6" stroke="#1d6b5c"/>
  <text class="muted" x="506.0" y="88" font-size="13">y = 1</text>

  <circle class="dotL" cx="164.0" cy="240" r="6">
    <animate attributeName="cx" values="164.0;369.2" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle class="dotR" cx="596.0" cy="100" r="6">
    <animate attributeName="cx" values="596.0;390.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <text class="muted" x="164.0" y="268" font-size="13">x→0⁻，f→-1</text>
  <text class="muted" x="470.0" y="128" font-size="13">x→0⁺，f→1</text>

  <text class="ink" x="36" y="318" font-size="13" font-weight="600">左右极限不相等 ⇒ 极限不存在（跳跃间断点）</text>
</svg>