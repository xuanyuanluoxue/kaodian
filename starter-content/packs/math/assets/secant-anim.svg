<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="动图：点 Q 沿抛物线滑向 P，割线逐渐变成切线，斜率从 2.5 趋近 2">
  <style>
    .bg { fill: #ffffff; }
    .axis { stroke: #6d6a60; stroke-width: 1.4; fill: none; }
    .tick { fill: #6d6a60; font-size: 12px; font-family: -apple-system, "PingFang SC", sans-serif; }
    .ink { fill: #1b1b18; font-family: -apple-system, "PingFang SC", sans-serif; }
    .muted { fill: #6d6a60; font-family: -apple-system, "PingFang SC", sans-serif; }
    .curve { stroke: #1d6b5c; stroke-width: 2.4; fill: none; }
    .sec { stroke: #a85a1f; stroke-width: 2.2; }
    .tan { stroke: #2f5d8a; stroke-width: 1.8; stroke-dasharray: 7 5; }
    .dot { fill: #a85a1f; }
    .hollow { fill: #ffffff; stroke: #1d6b5c; stroke-width: 2; }
    .accent { fill: #1d6b5c; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .axis { stroke: #a3a095; }
      .tick { fill: #a3a095; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .curve { stroke: #7cc9b4; }
      .sec { stroke: #e0a56f; }
      .tan { stroke: #8fb6dd; }
      .dot { fill: #e0a56f; }
      .hollow { fill: #1a1d1a; stroke: #7cc9b4; }
      .box { fill: #232720; stroke: #3b413b; }
      .box-ink { fill: #eae8e1; }
      .accent { fill: #7cc9b4; }
    }

  </style>
  <rect class="bg" x="0" y="0" width="760" height="380" rx="16"/>
  <text class="ink" x="36" y="42" font-size="18" font-weight="700">割线滑向切线：Q 沿曲线靠近 P</text>
  <text class="muted" x="36" y="64" font-size="13">斜率从 2.5 一路降到 2；切线就是割线的极限位置</text>

  <line class="axis" x1="180" y1="300" x2="590" y2="300" marker-end="url(#arr)"/>
  <line class="axis" x1="380" y1="320" x2="380" y2="50" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6d6a60"/></marker></defs>
  <g class="tick">
    <text x="212" y="322">-2</text><text x="292" y="322">-1</text>
    <text x="454" y="322">1</text><text x="534" y="322">2</text>
    <text x="356" y="338">O</text>
  </g>

  <path class="curve" d="M204.0,9.6 L212.0,35.4 L220.0,60.0 L228.0,83.4 L236.0,105.6 L244.0,126.6 L252.0,146.4 L260.0,165.0 L268.0,182.4 L276.0,198.6 L284.0,213.6 L292.0,227.4 L300.0,240.0 L308.0,251.4 L316.0,261.6 L324.0,270.6 L332.0,278.4 L340.0,285.0 L348.0,290.4 L356.0,294.6 L364.0,297.6 L372.0,299.4 L380.0,300.0 L388.0,299.4 L396.0,297.6 L404.0,294.6 L412.0,290.4 L420.0,285.0 L428.0,278.4 L436.0,270.6 L444.0,261.6 L452.0,251.4 L460.0,240.0 L468.0,227.4 L476.0,213.6 L484.0,198.6 L492.0,182.4 L500.0,165.0 L508.0,146.4 L516.0,126.6 L524.0,105.6 L532.0,83.4 L540.0,60.0 L548.0,35.4 L556.0,9.6"/>

  <line class="tan" x1="424.0" y1="294.0" x2="520.0" y2="150.0"/>
  <text class="muted" x="496.0" y="174.0" font-size="12">切线 y=2x-1</text>

  <line class="sec" x1="460" y1="240" x2="540" y2="60">
    <animate attributeName="x2" values="540;466.4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="60;230.016" dur="4s" repeatCount="indefinite"/>
  </line>

  <circle class="hollow" cx="460" cy="240" r="5"/>
  <text class="ink" x="422" y="266" font-size="13">P(1,1)</text>

  <circle class="dot" cx="540" cy="60" r="5.5">
    <animate attributeName="cx" values="540;466.4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;230.016" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text class="muted" x="536.0" y="46" font-size="13">Q(x, x²)</text>

  <text class="accent" x="36" y="352" font-size="13" font-weight="600">当 Q→P，割线斜率 → f'(1)=2</text>
</svg>