<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="图 1：数轴上画出条件 x 大于 1 与 -2 到 2 开区间两条范围，它们的公共部分就是例 1 的定义域 (1,2)，开区间两端画空心圆">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1b1b18; }
    .muted { fill: #6d6a60; }
    .axis { stroke: #55534a; stroke-width: 1.6; }
    .base { stroke: #dcd9cf; stroke-width: 2; }
    .rng { stroke: #1d6b5c; stroke-width: 2.6; stroke-linecap: round; }
    .dom { stroke: #1d6b5c; stroke-width: 9; }
    .tick { stroke: #55534a; stroke-width: 1.6; }
    .hollow { fill: #ffffff; stroke: #1d6b5c; stroke-width: 2.6; }
    .band { fill: #1d6b5c; opacity: 0.09; }
    .head { fill: #55534a; }
    .headA { fill: #1d6b5c; }
    .ui { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; }
    .lbl { font-size: 13px; }
    .num { font-size: 12.5px; }
    .cap { font-size: 12.5px; }
    .domlbl { font-size: 14px; font-weight: 700; fill: #1d6b5c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .axis { stroke: #b8b5aa; }
      .base { stroke: #3b413b; }
      .rng { stroke: #7cc9b4; }
      .dom { stroke: #7cc9b4; }
      .tick { stroke: #b8b5aa; }
      .hollow { fill: #1a1d1a; stroke: #7cc9b4; }
      .band { fill: #7cc9b4; }
      .head { fill: #b8b5aa; }
      .headA { fill: #7cc9b4; }
      .domlbl { fill: #7cc9b4; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" class="headA"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="300" rx="16"/>
  <text class="ui title ink" x="36" y="40">例 1 的定义域：三个条件取交集</text>
  <text class="ui sub muted" x="36" y="62">f(x) = ln(x-1) / √(4-x²)</text>

  <!-- 交集竖带：两条范围的公共部分 -->
  <rect class="band" x="480" y="72" width="100" height="146"/>

  <!-- 条件① x > 1（细线） -->
  <text class="ui lbl ink" x="36" y="99">① x &gt; 1</text>
  <line class="base" x1="180" y1="95" x2="680" y2="95"/>
  <line class="rng" x1="480" y1="95" x2="664" y2="95" marker-end="url(#ahA)"/>
  <circle class="hollow" cx="480" cy="95" r="5.5"/>

  <!-- 条件③ -2 < x < 2（细线） -->
  <text class="ui lbl ink" x="36" y="144">③ -2 &lt; x &lt; 2</text>
  <line class="base" x1="180" y1="140" x2="680" y2="140"/>
  <line class="rng" x1="180" y1="140" x2="580" y2="140"/>
  <circle class="hollow" cx="180" cy="140" r="5.5"/>
  <circle class="hollow" cx="580" cy="140" r="5.5"/>

  <!-- 数轴：刻度 -2 到 2，定义域 (1,2) 加粗 -->
  <line class="axis" x1="60" y1="210" x2="696" y2="210" marker-end="url(#ah)"/>
  <line class="tick" x1="180" y1="204" x2="180" y2="216"/>
  <line class="tick" x1="280" y1="204" x2="280" y2="216"/>
  <line class="tick" x1="380" y1="204" x2="380" y2="216"/>
  <line class="tick" x1="480" y1="204" x2="480" y2="216"/>
  <line class="tick" x1="580" y1="204" x2="580" y2="216"/>
  <text class="ui num ink" x="180" y="234" text-anchor="middle">-2</text>
  <text class="ui num ink" x="280" y="234" text-anchor="middle">-1</text>
  <text class="ui num ink" x="380" y="234" text-anchor="middle">0</text>
  <text class="ui num ink" x="480" y="234" text-anchor="middle">1</text>
  <text class="ui num ink" x="580" y="234" text-anchor="middle">2</text>
  <line class="dom" x1="480" y1="210" x2="580" y2="210"/>
  <circle class="hollow" cx="480" cy="210" r="7"/>
  <circle class="hollow" cx="580" cy="210" r="7"/>
  <text class="ui domlbl" x="530" y="190" text-anchor="middle">定义域 (1, 2)</text>

  <text class="ui cap muted" x="380" y="281" text-anchor="middle">图 1：定义域是三个条件的交集</text>
</svg>
