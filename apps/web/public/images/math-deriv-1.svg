<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="y=x² 在 x=1 处的切线与割线：割线的极限位置是切线">
  <style>
    .bg { fill: #ffffff; }
    .txt { fill: #1b1b18; font-family: "Noto Sans SC", sans-serif; }
    .axis { stroke: #1b1b18; stroke-width: 1.5; }
    .grid { stroke: #e5e2d9; stroke-width: 1; }
    .curve { stroke: #1d6b5c; stroke-width: 2.5; fill: none; }
    .tangent { stroke: #a85a1f; stroke-width: 2.2; }
    .secant { stroke: #a85a1f; stroke-width: 1.8; stroke-dasharray: 7 5; }
    .pt { fill: #1d6b5c; }
    .pt2 { fill: #a85a1f; }
    .lbl { fill: #1b1b18; font-size: 14px; font-family: "Noto Sans SC", sans-serif; }
    .lblA { fill: #a85a1f; font-size: 13px; font-family: "Noto Sans SC", sans-serif; }
    .lblG { fill: #1d6b5c; font-size: 15px; font-weight: bold; font-family: "Noto Sans SC", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .txt { fill: #eae8e1; }
      .axis { stroke: #eae8e1; }
      .grid { stroke: #3b413b; }
      .curve { stroke: #7cc9b4; }
      .tangent, .secant, .pt2, .lblA { stroke: #e0a56f; fill: #e0a56f; }
      .pt, .lblG { fill: #7cc9b4; }
      .lbl { fill: #eae8e1; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="pt" stroke="none"/>
    </marker>
  </defs>
  <rect width="760" height="380" class="bg"/>
  <text x="380" y="26" text-anchor="middle" class="lblG">y = x² 在 x = 1 处：割线斜率 → 切线斜率</text>

  <!-- grid (x = -2..2 step 1, y = -1..4 step 1) -->
  <line class="grid" x1="185" y1="40" x2="185" y2="340"/>
  <line class="grid" x1="300" y1="40" x2="300" y2="340"/>
  <line class="grid" x1="410" y1="40" x2="410" y2="340"/>
  <line class="grid" x1="635" y1="40" x2="635" y2="340"/>
  <line class="grid" x1="70" y1="69" x2="720" y2="69"/>
  <line class="grid" x1="70" y1="137.4" x2="720" y2="137.4"/>
  <line class="grid" x1="70" y1="205.8" x2="720" y2="205.8"/>
  <line class="grid" x1="70" y1="274.2" x2="720" y2="274.2"/>

  <!-- axes -->
  <line class="axis" x1="70" y1="340" x2="730" y2="340" marker-end="url(#arr)"/>
  <line class="axis" x1="395" y1="360" x2="395" y2="35" marker-end="url(#arr)"/>
  <text x="740" y="344" class="lbl">x</text>
  <text x="382" y="30" class="lbl">y</text>
  <text x="386" y="356" class="lbl">O</text>
  <text x="508" y="356" class="lbl">1</text>
  <text x="633" y="356" class="lbl">2</text>
  <text x="170" y="356" class="lbl">-1</text>
  <text x="285" y="356" class="lbl">-2</text>

  <!-- tangent y = 2x - 1 : through (0,-1)->(395,311) and (2,3)->(645,117.4) -->
  <line class="tangent" x1="332.5" y1="359.4" x2="707.5" y2="69"/>

  <!-- secant through P(1,1) and Q(1.5,2.25), slope 2.5 -->
  <line class="secant" x1="520" y1="214.2" x2="645" y2="93.2"/>

  <!-- parabola y=x², x=-2..2 step 0.25 (17 real points) -->
  <polyline class="curve" points="145,69 176.2,114.4 207.5,153.7 238.8,187 270,214.2 301.2,235.4 332.5,250.5 363.8,259.6 395,262.6 426.3,259.6 457.5,250.5 488.8,235.4 520,214.2 551.2,187 582.5,153.7 613.8,114.4 645,69"/>

  <!-- points -->
  <circle class="pt" cx="520" cy="214.2" r="5"/>
  <circle class="pt2" cx="582.5" cy="153.7" r="4.5"/>

  <!-- labels -->
  <text x="470" y="245" class="lbl">P (1, 1)</text>
  <text x="596" y="140" class="lblA">Q (1.5, 2.25)</text>
  <text x="640" y="100" class="lblA">割线斜率 = (2.25−1)/0.5 = 2.5</text>
  <text x="120" y="120" class="lblA">切线 y = 2x − 1</text>
  <text x="560" y="330" class="lblA">切线斜率 = 2 = f′(1)</text>
  <text x="110" y="365" class="lbl">点 Q 沿曲线滑向 P，割线的极限位置就是切线</text>
</svg>
