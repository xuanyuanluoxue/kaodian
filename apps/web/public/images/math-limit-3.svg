<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="图 3：函数 y 等于 sin x 除以 x 在 x=0 附近的光滑曲线，曲线趋于 1，但 x=0 处函数无定义（空心圆），是可去间断点；补上 f(0)=1 就连续">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1b1b18; }
    .muted { fill: #6d6a60; }
    .axis { stroke: #55534a; stroke-width: 1.6; }
    .tick { stroke: #55534a; stroke-width: 1.6; }
    .guide { stroke: #6d6a60; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .curve { fill: none; stroke: #1d6b5c; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .hollow { fill: #ffffff; stroke: #1d6b5c; stroke-width: 2.6; }
    .head { fill: #55534a; }
    .ui { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; }
    .num { font-size: 12.5px; }
    .cap { font-size: 12.5px; }
    .note { font-size: 12px; fill: #1d6b5c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .axis { stroke: #b8b5aa; }
      .tick { stroke: #b8b5aa; }
      .guide { stroke: #a3a095; }
      .curve { stroke: #7cc9b4; }
      .hollow { fill: #1a1d1a; stroke: #7cc9b4; }
      .head { fill: #b8b5aa; }
      .note { fill: #7cc9b4; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="340" rx="16"/>
  <text class="ui title ink" x="36" y="36">y = sin(x) / x：可去间断点</text>
  <text class="ui sub muted" x="36" y="58">x = 0 无定义，但 x → 0 时左右极限都是 1</text>

  <!-- 坐标系 -->
  <line class="axis" x1="75" y1="218" x2="710" y2="218" marker-end="url(#ah)"/>
  <text class="ui num ink" x="718" y="223">x</text>
  <line class="axis" x1="380" y1="298" x2="380" y2="84" marker-end="url(#ah)"/>
  <text class="ui num ink" x="392" y="88">y</text>
  <line class="tick" x1="103.5" y1="213" x2="103.5" y2="223"/>
  <line class="tick" x1="204" y1="213" x2="204" y2="223"/>
  <line class="tick" x1="292" y1="213" x2="292" y2="223"/>
  <line class="tick" x1="468" y1="213" x2="468" y2="223"/>
  <line class="tick" x1="556" y1="213" x2="556" y2="223"/>
  <line class="tick" x1="656.5" y1="213" x2="656.5" y2="223"/>
  <text class="ui num ink" x="103.5" y="240" text-anchor="middle">-π</text>
  <text class="ui num ink" x="204" y="240" text-anchor="middle">-2</text>
  <text class="ui num ink" x="292" y="240" text-anchor="middle">-1</text>
  <text class="ui num ink" x="368" y="240" text-anchor="middle">0</text>
  <text class="ui num ink" x="468" y="240" text-anchor="middle">1</text>
  <text class="ui num ink" x="556" y="240" text-anchor="middle">2</text>
  <text class="ui num ink" x="656.5" y="240" text-anchor="middle">π</text>

  <!-- 虚线标 y → 1 -->
  <line class="guide" x1="85" y1="92" x2="680" y2="92"/>
  <text class="ui sub muted" x="676" y="86" text-anchor="end">y → 1</text>

  <!-- 曲线：按 sin(x)/x 逐点计算，x 步长 0.25，含 x=±π 两个零点 -->
  <polyline class="curve" points="80.8,227.5 94,222.2 103.5,218 116,212.1 138,200.5 160,187.8 182,174.4 204,160.7 226,147.2 248,134.2 270,122.3 292,112 314,103.5 336,97.2 358,93.3 380,92 402,93.3 424,97.2 446,103.5 468,112 490,122.3 512,134.2 534,147.2 556,160.7 578,174.4 600,187.8 622,200.5 644,212.1 656.5,218 666,222.2 679.2,227.5"/>

  <!-- x=0 处：极限在，函数值缺席 -->
  <circle class="hollow" cx="380" cy="92" r="6.5"/>
  <text class="ui note" x="398" y="78">补上 f(0) = 1 就连续</text>

  <text class="ui cap muted" x="380" y="326" text-anchor="middle">图 3：可去间断点——极限存在，函数值缺席</text>
</svg>
