<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="for 循环执行轨迹：i 的值随迭代变化，条件何时变假">
  <style>
    .bg { fill: #f6f5f1; }
    .box { fill: #ffffff; stroke: #e5e2d9; stroke-width: 1.5; }
    .cell { fill: #e8f1ee; stroke: #cfe3dc; }
    .dead { fill: #f3e5df; stroke: #e0c4b4; }
    .flow { stroke: #1d6b5c; stroke-width: 2; fill: none; marker-end: url(#aloop); }
    .ink { fill: #1b1b18; }
    .muted { fill: #6d6a60; }
    .accent { fill: #1d6b5c; }
    .warn { fill: #b0563a; }
    .ui { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .title { font-size: 16px; font-weight: 700; }
    .code { font-size: 12.5px; }
    .lab { font-size: 13px; }
    .small { font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .box { fill: #232720; stroke: #3b413b; }
      .cell { fill: #1c322c; stroke: #2f5147; }
      .dead { fill: #342720; stroke: #5a4034; }
      .flow { stroke: #7cc9b4; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .accent { fill: #7cc9b4; }
      .warn { fill: #e0a283; }
    }
  </style>
  <defs>
    <marker id="aloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6b5c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="340" rx="16"/>
  <text class="ui title ink" x="30" y="34">for (i = 1; i &lt;= 4; i++) 的完整轨迹</text>
  <text class="ui code muted" x="30" y="54">判断 5 次，循环体跑 4 次；第 5 次判断才看到「假」</text>

  <!-- 时间线：5 次判断 -->
  <line class="flow" x1="60" y1="200" x2="700" y2="200"/>
  <!-- 节点 -->
  <g>
    <rect class="cell" x="80"  y="170" width="80" height="60" rx="8"/>
    <rect class="cell" x="220" y="170" width="80" height="60" rx="8"/>
    <rect class="cell" x="360" y="170" width="80" height="60" rx="8"/>
    <rect class="cell" x="500" y="170" width="80" height="60" rx="8"/>
    <rect class="dead" x="640" y="170" width="80" height="60" rx="8"/>
  </g>
  <g>
    <text class="mono code ink" x="120" y="194" text-anchor="middle">i = 1</text>
    <text class="ui small accent" x="120" y="216" text-anchor="middle">1&lt;=4 真</text>
    <text class="mono code ink" x="260" y="194" text-anchor="middle">i = 2</text>
    <text class="ui small accent" x="260" y="216" text-anchor="middle">2&lt;=4 真</text>
    <text class="mono code ink" x="400" y="194" text-anchor="middle">i = 3</text>
    <text class="ui small accent" x="400" y="216" text-anchor="middle">3&lt;=4 真</text>
    <text class="mono code ink" x="540" y="194" text-anchor="middle">i = 4</text>
    <text class="ui small accent" x="540" y="216" text-anchor="middle">4&lt;=4 真</text>
    <text class="mono code ink" x="680" y="194" text-anchor="middle">i = 5</text>
    <text class="ui small warn" x="680" y="216" text-anchor="middle">5&lt;=4 假</text>
  </g>
  <g>
    <text class="ui small muted" x="120" y="254" text-anchor="middle">判断①</text>
    <text class="ui small muted" x="260" y="254" text-anchor="middle">判断②</text>
    <text class="ui small muted" x="400" y="254" text-anchor="middle">判断③</text>
    <text class="ui small muted" x="540" y="254" text-anchor="middle">判断④</text>
    <text class="ui small warn" x="680" y="254" text-anchor="middle">判断⑤：退出</text>
  </g>

  <!-- 每次循环体做的事 -->
  <g>
    <rect class="box" x="80"  y="96" width="80" height="44" rx="8"/>
    <rect class="box" x="220" y="96" width="80" height="44" rx="8"/>
    <rect class="box" x="360" y="96" width="80" height="44" rx="8"/>
    <rect class="box" x="500" y="96" width="80" height="44" rx="8"/>
    <text class="mono code ink" x="120" y="114" text-anchor="middle">体: s+=1</text>
    <text class="mono small muted" x="120" y="131" text-anchor="middle">更新: i=2</text>
    <text class="mono code ink" x="260" y="114" text-anchor="middle">体: s+=2</text>
    <text class="mono small muted" x="260" y="131" text-anchor="middle">更新: i=3</text>
    <text class="mono code ink" x="400" y="114" text-anchor="middle">体: s+=3</text>
    <text class="mono small muted" x="400" y="131" text-anchor="middle">更新: i=4</text>
    <text class="mono code ink" x="540" y="114" text-anchor="middle">体: s+=4</text>
    <text class="mono small muted" x="540" y="131" text-anchor="middle">更新: i=5</text>
  </g>
  <g>
    <line class="flow" x1="120" y1="140" x2="120" y2="168"/>
    <line class="flow" x1="260" y1="140" x2="260" y2="168"/>
    <line class="flow" x1="400" y1="140" x2="400" y2="168"/>
    <line class="flow" x1="540" y1="140" x2="540" y2="168"/>
  </g>

  <!-- 初始化与退出标注 -->
  <text class="ui code accent" x="60" y="90" font-weight="700">初始化 i=1（只做一次）</text>
  <text class="ui code warn" x="560" y="90" font-weight="700">条件为假 → 循环结束，i 停在 5</text>
  <text class="ui small ink" x="30" y="300" font-weight="700">顺序口诀：初始化 → 判断 → 循环体 → 更新 → 回到判断。</text>
  <text class="ui small ink" x="30" y="320">循环体执行次数 = 「真」的判断次数（4 次）；让条件变假的那次判断照样发生（第 5 次）。</text>
</svg>
