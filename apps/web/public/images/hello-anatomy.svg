<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="hello.c 的五个零件">
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f5f1; stroke: #e5e2d9; }
    .ink { fill: #1b1b18; }
    .muted { fill: #6d6a60; }
    .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; }
    .label { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }
    .title { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; }
    .kw { fill: #1d6b5c; font-weight: 700; }
    .str { fill: #a85a1f; }
    .ln { fill: #a3a095; font-size: 12px; }
    .arrow { stroke: #1d6b5c; stroke-width: 1.6; fill: none; }
    .dot { fill: #1d6b5c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .panel { fill: #232720; stroke: #3b413b; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .kw { fill: #7cc9b4; }
      .str { fill: #e0a56f; }
      .ln { fill: #7d878c; }
      .arrow { stroke: #7cc9b4; }
      .dot { fill: #7cc9b4; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="860" height="440" rx="16"/>
  <text class="title ink" x="36" y="48">hello.c 的五个零件</text>

  <rect class="panel" x="36" y="76" width="440" height="300" rx="12"/>
  <text class="code ln" x="56" y="112">1</text>
  <text class="code kw" x="82" y="112">#include</text>
  <text class="code ink" x="168" y="112">&lt;stdio.h&gt;</text>

  <text class="code ln" x="56" y="148">2</text>
  <text class="code kw" x="82" y="148">int</text>
  <text class="code ink" x="126" y="148">main() {</text>

  <text class="code ln" x="56" y="184">3</text>
  <text class="code ink" x="82" y="184">    printf(</text>
  <text class="code str" x="160" y="184">"hello\n"</text>
  <text class="code ink" x="236" y="184">);</text>

  <text class="code ln" x="56" y="220">4</text>
  <text class="code kw" x="82" y="220">    return</text>
  <text class="code ink" x="160" y="220">0;</text>

  <text class="code ln" x="56" y="256">5</text>
  <text class="code ink" x="82" y="256">}</text>

  <text class="code ln" x="56" y="304">// 注释是可选的第六种零件</text>

  <!-- labels -->
  <circle class="dot" cx="520" cy="106" r="4"/>
  <text class="label ink" x="534" y="111">预处理：把 printf 的声明拿进来</text>

  <circle class="dot" cx="520" cy="148" r="4"/>
  <text class="label ink" x="534" y="153">入口：操作系统从这里开始</text>

  <circle class="dot" cx="520" cy="190" r="4"/>
  <text class="label ink" x="534" y="195">语句：调用 printf，输出 hello</text>

  <circle class="dot" cx="520" cy="232" r="4"/>
  <text class="label ink" x="534" y="237">返回：0 表示正常结束</text>

  <circle class="dot" cx="520" cy="274" r="4"/>
  <text class="label ink" x="534" y="279">函数体结束：右花括号不加分号</text>

  <path class="arrow" d="M516 106 H488"/>
  <path class="arrow" d="M516 148 H488"/>
  <path class="arrow" d="M516 190 H488"/>
  <path class="arrow" d="M516 232 H488"/>
  <path class="arrow" d="M516 274 H488"/>
</svg>