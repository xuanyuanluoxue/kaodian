<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="一维数组内存格子图：下标 0 到 4 的五个格子存 13 20 30 40 50，a[5] 越界打红叉，sizeof(a) 为 20 字节">
  <style>
    .bg { fill: #f6f5f1; }
    .ink { fill: #1b1b18; }
    .cell { fill: #ffffff; stroke: #1b1b18; stroke-width: 1.5; }
    .label { fill: #1d6b5c; }
    .bad { fill: #a83a31; }
    .note { fill: #1b1b18; }
    .soft { fill: #e5e2d9; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .ink { fill: #eae8e1; }
      .cell { fill: #242924; stroke: #eae8e1; }
      .label { fill: #7cc9b4; }
      .bad { fill: #e0938a; }
      .note { fill: #eae8e1; }
      .soft { fill: #3b413b; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="320"/>

  <!-- title -->
  <text class="ink" x="40" y="44" font-family="sans-serif" font-size="18" font-weight="bold">数组 int a[5] = {13, 20, 30, 40, 50};</text>

  <!-- 5 cells, each 100x60, starting x=60, y=80 -->
  <rect class="cell" x="60"  y="80" width="100" height="60"/>
  <rect class="cell" x="160" y="80" width="100" height="60"/>
  <rect class="cell" x="260" y="80" width="100" height="60"/>
  <rect class="cell" x="360" y="80" width="100" height="60"/>
  <rect class="cell" x="460" y="80" width="100" height="60"/>

  <!-- values -->
  <text class="ink" x="110" y="118" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">13</text>
  <text class="ink" x="210" y="118" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">20</text>
  <text class="ink" x="310" y="118" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">30</text>
  <text class="ink" x="410" y="118" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">40</text>
  <text class="ink" x="510" y="118" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">50</text>

  <!-- subscripts -->
  <text class="label" x="110" y="165" font-family="sans-serif" font-size="15" text-anchor="middle">a[0]</text>
  <text class="label" x="210" y="165" font-family="sans-serif" font-size="15" text-anchor="middle">a[1]</text>
  <text class="label" x="310" y="165" font-family="sans-serif" font-size="15" text-anchor="middle">a[2]</text>
  <text class="label" x="410" y="165" font-family="sans-serif" font-size="15" text-anchor="middle">a[3]</text>
  <text class="label" x="510" y="165" font-family="sans-serif" font-size="15" text-anchor="middle">a[4]</text>

  <!-- illegal a[5] ghost cell -->
  <rect class="soft" x="560" y="80" width="100" height="60" stroke-dasharray="6 5" stroke="#a83a31" stroke-width="1.5"/>
  <text class="bad" x="610" y="118" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">a[5]?</text>
  <text class="label" x="610" y="165" font-family="sans-serif" font-size="15" text-anchor="middle">不存在</text>

  <!-- red cross over ghost cell -->
  <line x1="570" y1="90" x2="650" y2="130" stroke="#a83a31" stroke-width="4" stroke-linecap="round"/>
  <line x1="650" y1="90" x2="570" y2="130" stroke="#a83a31" stroke-width="4" stroke-linecap="round"/>

  <!-- overflow arrow: from a[4] area curving into a[5] -->
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a83a31"/>
    </marker>
  </defs>
  <path d="M 480 150 C 520 205, 560 205, 600 152" fill="none" stroke="#a83a31" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text class="bad" x="560" y="215" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">a[5] = 99 越界：写坏相邻内存</text>

  <!-- sizeof note -->
  <text class="note" x="60" y="262" font-family="sans-serif" font-size="15">sizeof(a) = 5 × 4 = 20 字节（int 每格占 4 字节）</text>
  <text class="note" x="60" y="290" font-family="sans-serif" font-size="15">下标从 0 开始，合法下标只有 0 ~ 4</text>
</svg>
