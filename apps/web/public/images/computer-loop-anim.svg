<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="动图：for 循环沿“初始化 → 判断 → 循环体 → i++”绕圈，条件为假时退出">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1b1b18; font-family: -apple-system, "PingFang SC", sans-serif; }
    .muted { fill: #6d6a60; font-family: -apple-system, "PingFang SC", sans-serif; }
    .box { fill: #f6f5f1; stroke: #d6d2c6; stroke-width: 1.5; }
    .box-ink { fill: #1b1b18; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; }
    .box-sub { fill: #6d6a60; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .path { stroke: #c9c5b9; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .dot { fill: #a85a1f; }
    .accent { fill: #1d6b5c; }
    .exit { stroke: #1d6b5c; stroke-width: 2; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .ink { fill: #eae8e1; }
      .muted { fill: #a3a095; }
      .box { fill: #232720; stroke: #3b413b; }
      .box-ink { fill: #eae8e1; }
      .box-sub { fill: #a3a095; }
      .path { stroke: #4a504a; }
      .dot { fill: #e0a56f; }
      .accent { fill: #7cc9b4; }
      .exit { stroke: #7cc9b4; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="340" rx="16"/>
  <text class="ink" x="36" y="42" font-size="18" font-weight="700">for 循环怎么绕圈</text>
  <text class="muted" x="36" y="64" font-size="13">初始化一次；判断 → 循环体 → i++ → 再判断，直到条件为假</text>

  <path class="path" d="M150,105 H380 H610 V255 H380 V105"/>
  <path class="exit" d="M450,105 H520" marker-end="url(#arr3)"/>
  <defs><marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d6b5c"/></marker></defs>
  <text class="accent" x="500" y="96" font-size="12">i&gt;4 → 退出</text>

  <rect class="box" x="90" y="80" width="120" height="50" rx="10"/>
  <text class="box-ink" x="106" y="102">初始化</text>
  <text class="box-sub" x="106" y="120">i = 1</text>

  <rect class="box" x="310" y="80" width="140" height="50" rx="10"/>
  <text class="box-ink" x="326" y="102">判断条件</text>
  <text class="box-sub" x="326" y="120">i &lt;= 4 ?</text>

  <rect class="box" x="550" y="80" width="120" height="50" rx="10"/>
  <text class="box-ink" x="566" y="102">循环体</text>
  <text class="box-sub" x="566" y="120">printf("%d", i)</text>

  <rect class="box" x="550" y="230" width="120" height="50" rx="10"/>
  <text class="box-ink" x="566" y="252">更新</text>
  <text class="box-sub" x="566" y="270">i++</text>

  <circle class="dot" cx="150" cy="105" r="6">
    <animateMotion dur="7s" repeatCount="indefinite" path="M150,105 H380 H610 V255 H380 V105"/>
  </circle>

  <text class="muted" x="36" y="318" font-size="13">注意：判断在循环体之前；条件为假时直接退出，循环体一次都不执行</text>
</svg>