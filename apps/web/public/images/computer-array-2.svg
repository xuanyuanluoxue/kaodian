<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="二维数组 3x3 网格图与行优先一维展开对照：内存里其实是一条线">
  <style>
    .bg { fill: #f6f5f1; }
    .ink { fill: #1b1b18; }
    .cell { fill: #ffffff; stroke: #1b1b18; stroke-width: 1.5; }
    .label { fill: #1d6b5c; }
    .soft { fill: #e5e2d9; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d1a; }
      .ink { fill: #eae8e1; }
      .cell { fill: #242924; stroke: #eae8e1; }
      .label { fill: #7cc9b4; }
      .soft { fill: #3b413b; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="340"/>

  <!-- title -->
  <text class="ink" x="40" y="40" font-family="sans-serif" font-size="17" font-weight="bold">int a[3][3] — 左边是表格，右边是内存里的一条线</text>

  <!-- left: 3x3 grid, cells 90x50, start x=70, y=70 -->
  <!-- row labels -->
  <text class="label" x="55" y="100" font-family="sans-serif" font-size="13" text-anchor="end">行0</text>
  <text class="label" x="55" y="155" font-family="sans-serif" font-size="13" text-anchor="end">行1</text>
  <text class="label" x="55" y="210" font-family="sans-serif" font-size="13" text-anchor="end">行2</text>

  <!-- cells row 0 -->
  <rect class="cell" x="70" y="70" width="90" height="50"/>
  <rect class="cell" x="160" y="70" width="90" height="50"/>
  <rect class="cell" x="250" y="70" width="90" height="50"/>
  <!-- cells row 1 -->
  <rect class="cell" x="70" y="120" width="90" height="50"/>
  <rect class="cell" x="160" y="120" width="90" height="50"/>
  <rect class="cell" x="250" y="120" width="90" height="50"/>
  <!-- cells row 2 -->
  <rect class="cell" x="70" y="170" width="90" height="50"/>
  <rect class="cell" x="160" y="170" width="90" height="50"/>
  <rect class="cell" x="250" y="170" width="90" height="50"/>

  <!-- values 101..103 / 201..203 / 301..303 -->
  <text class="ink" x="115" y="100" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">101</text>
  <text class="ink" x="205" y="100" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">102</text>
  <text class="ink" x="295" y="100" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">103</text>
  <text class="ink" x="115" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">201</text>
  <text class="ink" x="205" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">202</text>
  <text class="ink" x="295" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">203</text>
  <text class="ink" x="115" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">301</text>
  <text class="ink" x="205" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">302</text>
  <text class="ink" x="295" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">303</text>

  <!-- column labels -->
  <text class="label" x="115" y="242" font-family="sans-serif" font-size="13" text-anchor="middle">列0</text>
  <text class="label" x="205" y="242" font-family="sans-serif" font-size="13" text-anchor="middle">列1</text>
  <text class="label" x="295" y="242" font-family="sans-serif" font-size="13" text-anchor="middle">列2</text>

  <!-- a[1][2] highlight: cell row1 col2 (x=250,y=120) -->
  <rect x="250" y="120" width="90" height="50" fill="none" stroke="#1d6b5c" stroke-width="3"/>
  <text class="label" x="295" y="272" font-family="sans-serif" font-size="14" text-anchor="middle">a[1][2] = 203</text>
  <text class="ink" x="295" y="295" font-family="sans-serif" font-size="13" text-anchor="middle">行优先位置：1×3+2 = 5</text>

  <!-- connecting dashed lines from highlighted cell to flat row position 5 -->
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d6b5c"/>
    </marker>
  </defs>
  <path d="M 340 145 C 400 145, 400 290, 455 290" fill="none" stroke="#1d6b5c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>

  <!-- right: flat 1D row of 9 cells, each 32x40, start x=460, y=270 -->
  <rect class="cell" x="460" y="270" width="32" height="40"/>
  <rect class="cell" x="492" y="270" width="32" height="40"/>
  <rect class="cell" x="524" y="270" width="32" height="40"/>
  <rect class="cell" x="556" y="270" width="32" height="40"/>
  <rect class="cell" x="588" y="270" width="32" height="40"/>
  <rect class="cell" x="620" y="270" width="32" height="40"/>
  <rect class="cell" x="652" y="270" width="32" height="40"/>
  <rect class="cell" x="684" y="270" width="32" height="40"/>
  <rect class="cell" x="716" y="270" width="32" height="40"/>

  <!-- flat values -->
  <text class="ink" x="476" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">101</text>
  <text class="ink" x="508" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">102</text>
  <text class="ink" x="540" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">103</text>
  <text class="ink" x="572" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">201</text>
  <text class="ink" x="604" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">202</text>
  <text class="ink" x="636" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">203</text>
  <text class="ink" x="668" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">301</text>
  <text class="ink" x="700" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">302</text>
  <text class="ink" x="732" y="296" font-family="sans-serif" font-size="11" text-anchor="middle">303</text>

  <!-- flat subscripts -->
  <text class="label" x="476" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">0</text>
  <text class="label" x="508" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">1</text>
  <text class="label" x="540" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">2</text>
  <text class="label" x="572" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">3</text>
  <text class="label" x="604" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">4</text>
  <text class="label" x="636" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">5</text>
  <text class="label" x="668" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">6</text>
  <text class="label" x="700" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">7</text>
  <text class="label" x="732" y="326" font-family="sans-serif" font-size="10" text-anchor="middle">8</text>

  <!-- caption under flat row -->
  <text class="label" x="460" y="252" font-family="sans-serif" font-size="14" font-weight="bold">行优先展开：内存里其实是一条线</text>
</svg>
