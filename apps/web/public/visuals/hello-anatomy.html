<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hello.c 解剖台 · 考点</title>
<style>
  :root {
    --bg:#f7f6f2; --surface:#fff; --ink:#1b1b18; --muted:#6d6a60;
    --line:#e5e2d9; --line-strong:#d6d2c6; --accent:#1d6b5c;
    --accent-soft:#e8f1ee; --accent-line:#cfe3dc; --danger:#a83a31;
    --danger-soft:#fbebe9; --code:#f1f0ea; --ok:#3f8f6f; --ok-soft:#edf7f1;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#121412; --surface:#1a1d1a; --ink:#eae8e1; --muted:#a3a095;
      --line:#2c302c; --line-strong:#3b413b; --accent:#7cc9b4;
      --accent-soft:#1c322c; --accent-line:#2f5147; --danger:#e0938a;
      --danger-soft:#2e1c1a; --code:#232720; --ok:#6fc3a1; --ok-soft:#17291f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:30px 20px 70px}
  a.back{color:var(--accent);text-decoration:none;font-size:13px}
  header{padding:10px 0 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px}
  .lab{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px}
  .pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
  .pane-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .code{font-family:var(--mono);font-size:14px;line-height:1.9}
  .line{display:flex;gap:10px;padding:2px 8px;border-radius:6px;cursor:pointer;white-space:pre}
  .line:hover{background:var(--accent-soft)}
  .line.active{background:var(--accent-soft);outline:1px solid var(--accent-line)}
  .ln{color:var(--muted);width:18px;text-align:right;flex:0 0 auto;user-select:none;font-size:12px;padding-top:2px}
  .tok{color:var(--ink)}
  .tok.kw{color:var(--accent);font-weight:700}
  .tok.str{color:#a85a1f}
  .tok.cm{color:var(--muted);font-style:italic}
  .toggles{display:grid;gap:7px;margin:18px 0 12px;padding-top:14px;border-top:1px dashed var(--line)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
  .toggle input{accent-color:var(--accent);width:16px;height:16px}
  .toggle b{font-family:var(--mono);color:var(--ink);font-weight:600}
  .run{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;
    font:inherit;font-size:14px;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer}
  .run:hover{filter:brightness(.95)}
  .info-title{font-weight:700;font-size:15px;margin-bottom:6px}
  .info-text{font-size:14px;color:var(--muted);margin:0}
  .info-text code{font-family:var(--mono);background:var(--code);border:1px solid var(--line);
    padding:1px 5px;border-radius:5px;font-size:.92em;color:var(--ink)}
  .terminal{margin-top:16px;background:#14171a;border-radius:12px;overflow:hidden;border:1px solid #2a2f33}
  .term-bar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#1c2125;color:#9aa3a8;font-size:11px}
  .dot{width:9px;height:9px;border-radius:50%;background:#5c666b}
  .term-body{margin:0;padding:14px 16px;color:#d7e0dd;font-family:var(--mono);font-size:13.5px;line-height:1.7;white-space:pre-wrap;min-height:96px}
  .term-body .err{color:#ff9c8f}
  .term-body .ok{color:#7cc9b4}
  .term-body .dim{color:#7d878c}
  .challenge{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
  .challenge h2{font-size:16px;margin:0 0 6px}
  .challenge p{font-size:14px;color:var(--muted);margin:0 0 12px}
  .choices{display:grid;gap:8px}
  .choice{appearance:none;text-align:left;background:var(--surface);border:1.5px solid var(--line-strong);
    color:var(--ink);font:inherit;font-size:14px;padding:10px 13px;border-radius:10px;cursor:pointer}
  .choice:hover{border-color:var(--accent)}
  .choice.right{border-color:var(--ok);background:var(--ok-soft)}
  .choice.wrong{border-color:var(--danger);background:var(--danger-soft)}
  .feedback{margin-top:10px;font-size:13px;min-height:20px}
  footer{margin-top:28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
  code{font-family:var(--mono);background:var(--code);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:.92em}
  @media(max-width:760px){.lab{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/console?page=p_dba6ec51f0f8">← 回到第 1 课</a>
  <header>
    <h1>hello.c 解剖台</h1>
    <div class="sub">左边点任意一行，右边告诉你它在干什么；下面拨开关，看删掉它会发生什么。</div>
  </header>

  <div class="lab">
    <div class="pane">
      <div class="pane-title">hello.c</div>
      <div class="code" id="code"></div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="tInclude" checked> 保留 <b>#include &lt;stdio.h&gt;</b></label>
        <label class="toggle"><input type="checkbox" id="tSemi" checked> 保留 <b>printf</b> 末尾的分号</label>
        <label class="toggle"><input type="checkbox" id="tNewline" checked> 保留 <b>\n</b></label>
        <label class="toggle"><input type="checkbox" id="tReturn" checked> 保留 <b>return 0;</b></label>
      </div>
      <button class="run" id="run">▶ 运行</button>
    </div>

    <div class="pane">
      <div class="pane-title">这一行在干什么</div>
      <div class="info-title" id="infoTitle">第 1 行 · 预处理</div>
      <p class="info-text" id="infoText">点左边的代码。</p>
    </div>
  </div>

  <div class="terminal">
    <div class="term-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 终端</div>
    <pre class="term-body" id="term">$ gcc hello.c -o hello
<span class="dim">（点「运行」看结果）</span></pre>
  </div>

  <section class="challenge">
    <h2>先猜再拨：把 `\n` 去掉，会怎样？</h2>
    <p>别急着拨开关，先选一个你认为的结果。</p>
    <div class="choices" id="choices">
      <button class="choice" data-ok="0">A. 多输出一个空行</button>
      <button class="choice" data-ok="0">B. 什么都不输出</button>
      <button class="choice" data-ok="1">C. 输出 hello，但命令提示符挤在同一行</button>
      <button class="choice" data-ok="0">D. 编译错误，程序跑不起来</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </section>

  <footer>考点 Kaodian · 自制可视化 · 想单步看变量，去 <a href="https://pythontutor.com/c.html" target="_blank" rel="noreferrer">Python Tutor C</a></footer>
</div>

<script>
const LINE_INFO = {
  include: { title: '第 1 行 · 预处理指令', text: '把 <code>stdio.h</code> 里的声明“贴”进来，编译器才知道 <code>printf</code> 是什么。删掉它，很多编译器会报“隐式声明”。' },
  main:    { title: '第 2 行 · 主函数', text: '<code>main</code> 是程序的入口，操作系统从这里开始执行。<code>int</code> 表示它要还给系统一个整数。' },
  printf:  { title: '第 3 行 · 函数调用', text: '调用 <code>printf</code>，把字符串送到标准输出。<code>\\n</code> 是换行；末尾的分号表示“这条语句结束”。' },
  return:  { title: '第 4 行 · 返回', text: '<code>return 0</code> 告诉系统“正常结束”。0 是约定俗成的成功码，非 0 通常表示出错。' },
  close:   { title: '第 5 行 · 函数结束', text: '右花括号闭合 <code>main</code> 的函数体。注意：它不是语句，后面不加分号。' },
};
const EXPLAIN = {
  include: '预处理：把 stdio.h 的声明展开进来',
  main: '程序入口：操作系统从这里开始执行',
  printf: '调用 printf，把 hello 写到屏幕；\\n 负责换行',
  return: '返回 0：告诉系统正常结束',
  close: '函数体结束：右花括号，不加分号',
};

const els = {
  include: document.getElementById('tInclude'),
  semi: document.getElementById('tSemi'),
  newline: document.getElementById('tNewline'),
  ret: document.getElementById('tReturn'),
};
const codeEl = document.getElementById('code');
const termEl = document.getElementById('term');
const infoTitle = document.getElementById('infoTitle');
const infoText = document.getElementById('infoText');
let active = 'include';

function codeLines() {
  const lines = [];
  if (els.include.checked) lines.push({ id: 'include', html: '<span class="tok kw">#include</span> <span class="tok">&lt;stdio.h&gt;</span>' });
  lines.push({ id: 'main', html: '<span class="tok kw">int</span> <span class="tok">main() {</span>' });
  const semi = els.semi.checked ? ';' : '';
  const nl = els.newline.checked ? '\\n' : '';
  lines.push({ id: 'printf', html: '    <span class="tok">printf(</span><span class="tok str">"hello' + nl + '"</span><span class="tok">)' + semi + '</span>' });
  if (els.ret.checked) lines.push({ id: 'return', html: '    <span class="tok kw">return</span> <span class="tok">0;</span>' });
  lines.push({ id: 'close', html: '<span class="tok">}</span>' });
  return lines;
}

function renderCode() {
  codeEl.innerHTML = '';
  codeLines().forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'line' + (line.id === active ? ' active' : '');
    div.dataset.id = line.id;
    div.innerHTML = '<span class="ln">' + (i + 1) + '</span><span>' + line.html + '</span>';
    div.addEventListener('click', () => {
      active = line.id;
      renderCode();
      infoTitle.textContent = LINE_INFO[line.id].title;
      infoText.innerHTML = LINE_INFO[line.id].text;
    });
    codeEl.appendChild(div);
  });
}

function run() {
  const hasInclude = els.include.checked;
  const hasSemi = els.semi.checked;
  const hasNL = els.newline.checked;
  const hasRet = els.ret.checked;

  if (!hasInclude) {
    termEl.innerHTML = '$ gcc hello.c -o hello\n' +
      '<span class="err">hello.c:3:5: error: implicit declaration of function ‘printf’</span>\n' +
      '<span class="err">note: include &lt;stdio.h&gt; or declare ‘printf’</span>\n' +
      '<span class="dim">exit 1（编译没通过，没有生成可执行文件）</span>';
    return;
  }
  if (!hasSemi) {
    termEl.innerHTML = '$ gcc hello.c -o hello\n' +
      '<span class="err">hello.c:4:5: error: expected ‘;’ before ‘return’</span>\n' +
      '<span class="dim">exit 1（少一个分号，编译器卡在下一行）</span>';
    return;
  }
  let out = '$ gcc hello.c -o hello\n$ ./hello\n';
  out += 'hello' + (hasNL ? '\n' : '');
  if (!hasNL) out += '$ <span class="dim">（提示符挤在同一行，因为没换行）</span>\n';
  if (!hasRet) out += '<span class="dim">（main 没有 return；C99 起默认返回 0，但考试要写）</span>\n';
  out += '<span class="ok">exit 0</span>';
  termEl.innerHTML = out;
}

Object.values(els).forEach(el => el.addEventListener('change', renderCode));
document.getElementById('run').addEventListener('click', run);

document.querySelectorAll('.choice').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.choice').forEach(b => b.classList.remove('right', 'wrong'));
    const ok = btn.dataset.ok === '1';
    btn.classList.add(ok ? 'right' : 'wrong');
    document.getElementById('feedback').innerHTML = ok
      ? '✅ 对。没有 <code>\\n</code>，hello 后面不换行，shell 提示符会紧跟在后面。去拨掉开关、点运行看看。'
      : '再想想：<code>\\n</code> 只影响换行，不影响编译。去拨掉开关、点运行看看。';
  });
});

renderCode();
</script>
</body>
</html>
